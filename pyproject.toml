[project]
name = "inventory"
version = "0.1.0"
description = "Scan AWS resource metadata across accounts and regions and serve it over an API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Shared by every component; each deployable adds its own extra (see deploy/Containerfile).
dependencies = [
    "aws-lambda-powertools[tracer]>=3.3",
    "boto3>=1.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
broker = [
    "cryptography>=43",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "redis>=5.2",
]
planner = [
    "psycopg[binary,pool]>=3.2",
    "python-ulid>=3.0",
    "sqlalchemy>=2.0.36",
]
worker = [
    "alembic>=1.14",  # the migrate task runs from the worker image
    "psycopg[binary,pool]>=3.2",
    "python-ulid>=3.0",
    "sqlalchemy>=2.0.36",
]
api = [
    "anyio>=4.6",
    "fastapi>=0.115",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-botocore>=0.49b0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-propagator-aws-xray>=1.0",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-sdk-extension-aws>=2.0",
    "psycopg[binary,pool]>=3.2",
    "python-ulid>=3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "inventory[api,broker,planner,worker]",
    "boto3-stubs[essential,iam,route53,sts,kms,secretsmanager,ecs,stepfunctions]>=1.35",
    "fakeredis[lua]>=2.26",
    "moto[server]>=5.0.20",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "time-machine>=2.16",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inventory"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["inventory"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["moto.*", "fakeredis.*", "respx.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' --strict-markers"
markers = ["integration: needs PostgreSQL / Redis from compose.yaml"]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["inventory"]
branch = true
